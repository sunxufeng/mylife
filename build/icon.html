<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
        overflow: hidden;
      }
      .icon {
        position: relative;
        width: 1024px;
        height: 1024px;
      }
      /* 圆角方形主体：暖色琥珀-珊瑚渐变 */
      .plate {
        position: absolute;
        inset: 72px;
        border-radius: 232px;
        background: linear-gradient(158deg, #f5b95c 0%, #e87245 44%, #b84e36 100%);
        box-shadow: inset 0 6px 26px rgba(255, 255, 255, 0.28),
          inset 0 -18px 46px rgba(60, 20, 10, 0.35);
        overflow: hidden;
      }
      /* 斜向高光 */
      .sheen {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 252, 242, 0.18) 0%,
          rgba(255, 252, 242, 0.18) 38%,
          rgba(255, 252, 242, 0) 38.4%
        );
      }
      /* 底部细密横纹，呼应工作台台面纹理 */
      .lines {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 26%;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 252, 242, 0) 0px,
          rgba(255, 252, 242, 0) 22px,
          rgba(255, 252, 242, 0.095) 22px,
          rgba(255, 252, 242, 0.095) 24px
        );
      }
      .glyph {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Times New Roman', 'Songti SC', 'STSong', serif;
        font-weight: 600;
        font-size: 492px;
        line-height: 1;
        color: #fffbf5;
        text-shadow: 0 6px 24px rgba(60, 20, 10, 0.35);
        padding-bottom: 74px;
      }
      .rule {
        position: absolute;
        left: 50%;
        bottom: 212px;
        transform: translateX(-50%);
        width: 232px;
        height: 7px;
        border-radius: 4px;
        background: linear-gradient(
          90deg,
          rgba(248, 214, 148, 0) 0%,
          #f8d694 24%,
          #fff2cf 50%,
          #f8d694 76%,
          rgba(248, 214, 148, 0) 100%
        );
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="plate">
        <div class="sheen"></div>
        <div class="lines"></div>
        <div class="glyph">W</div>
        <div class="rule"></div>
      </div>
    </div>
  </body>
</html>
