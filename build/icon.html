<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
        overflow: hidden;
      }
      .icon {
        position: relative;
        width: 1024px;
        height: 1024px;
      }
      /* 圆角方形主体：苔绿渐变 */
      .plate {
        position: absolute;
        inset: 72px;
        border-radius: 232px;
        background: linear-gradient(158deg, #8da27b 0%, #6e8163 44%, #3f5238 100%);
        box-shadow: inset 0 6px 26px rgba(255, 255, 255, 0.24),
          inset 0 -18px 46px rgba(22, 34, 20, 0.36);
        overflow: hidden;
      }
      /* 斜向高光，呼应设置面板里的主题色卡 */
      .sheen {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 253, 247, 0.15) 0%,
          rgba(255, 253, 247, 0.15) 38%,
          rgba(255, 253, 247, 0) 38.4%
        );
      }
      /* 底部细密横纹，像档案盒的抽绳 */
      .lines {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 26%;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 253, 247, 0) 0px,
          rgba(255, 253, 247, 0) 22px,
          rgba(255, 253, 247, 0.085) 22px,
          rgba(255, 253, 247, 0.085) 24px
        );
      }
      .glyph {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Songti SC', 'STSong', 'Source Han Serif SC', serif;
        font-weight: 600;
        font-size: 492px;
        line-height: 1;
        color: #fdfbf5;
        text-shadow: 0 6px 24px rgba(24, 36, 22, 0.4);
        padding-bottom: 74px;
      }
      .rule {
        position: absolute;
        left: 50%;
        bottom: 212px;
        transform: translateX(-50%);
        width: 232px;
        height: 7px;
        border-radius: 4px;
        background: linear-gradient(
          90deg,
          rgba(216, 186, 128, 0) 0%,
          #d8ba80 24%,
          #f2e0b6 50%,
          #d8ba80 76%,
          rgba(216, 186, 128, 0) 100%
        );
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="plate">
        <div class="sheen"></div>
        <div class="lines"></div>
        <div class="glyph">M</div>
        <div class="rule"></div>
      </div>
    </div>
  </body>
</html>
